
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Business Directory</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>Local Business Directory</h1>
        <p>Find and explore local businesses in your community.</p>
    </header>

    <main>
        <section class="search-section">
            <h2>Explore Businesses</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Search businesses..."
                aria-label="Search businesses"
            >

            <select id="categoryFilter" aria-label="Filter by category">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Retail">Retail</option>
                <option value="Services">Services</option>
                <option value="Technology">Technology</option>
            </select>
        </section>

        <section class="directory-section">
            <h2>Business Directory</h2>
            <p id="resultCount"></p>

            <div id="businessList" class="business-grid"></div>

            <p id="noResults" hidden>
                No businesses found. Try another search.
            </p>
        </section>
    </main>

    <footer>
        <p>Cloud Platform Literacy Project</p>
        <p>All businesses listed are fictional examples.</p>
    </footer>

</body>
</html>
